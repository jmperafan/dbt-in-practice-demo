name: dbt CI

# Slim CI (8.7/8.8): runs only on a pull request, builds only what the PR
# actually changed plus its downstream (state:modified+), deferring
# everything else to prod's last known-good state instead of rebuilding
# the whole project on every PR. NOT YET VERIFIED against a real run —
# written from dbt's and GitHub Actions' own documented syntax, same
# status as everything else in this project's Snowflake move.

on:
  pull_request:
    paths:
      - "models/**"
      - "macros/**"
      - "tests/**"
      - "checks/**"
      - "dbt_project.yml"
      - "packages.yml"

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt v2
        run: curl -fsSL https://get.dbt.com | sh

      - name: Install packages
        run: dbt deps --project-dir . --profiles-dir .

      - name: Fetch production manifest for --defer/--state
        run: |
          mkdir -p prod-artifacts
          curl -sfL -o prod-artifacts/manifest.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/prod-manifest/manifest.json"

      - name: dbt build — only what changed, deferring the rest to prod
        # --target ci is what actually routes this at the "ci" output in
        # profiles.yml (its own ci_pr_<N> schema, from GITHUB_PR_NUMBER
        # below) — profiles.yml's own `target:` key is a plain literal
        # ("dev"), not read from any env var, so without this flag every
        # CI run would silently build into the dev schema instead.
        run: >
          dbt build
          --project-dir . --profiles-dir . --target ci
          --select "selector:ci_slim"
          --defer --state ./prod-artifacts
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
