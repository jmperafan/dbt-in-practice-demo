packages:
  # Only usable now that this project runs on Snowflake — see
  # ../lesson-2-ai-infrastructure/README.md (2.3). Built and validated by dbt Labs
  # against Snowflake (Cortex), Databricks, BigQuery, and Redshift; not
  # DuckDB, which is why this wasn't here before the Snowflake move.
  - package: dbt-labs/dbt_context_engineering
    version: 0.2.0
  - package: dbt-labs/codegen
    version: [">=0.12.0", "<1.0.0"]
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]
  # Declared directly, not left to arrive transitively: fct_court_activity.sql
  # calls dbt_utils.generate_surrogate_key and metricflow_time_spine.sql
  # calls dbt_utils.date_spine. It currently resolves anyway (codegen above
  # depends on it), but a macro this project calls by name belongs in this
  # project's own packages.yml — otherwise a future version bump to codegen
  # that drops or narrows that dependency breaks these models with no
  # obvious link back to the real cause.
  - package: dbt-labs/dbt_utils
    version: [">=1.4.0", "<2.0.0"]
