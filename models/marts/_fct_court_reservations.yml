models:
  - name: fct_court_reservations
    description: >
      One row per court reservation. Incremental: only reservations whose
      loaded_at is newer than the last run get processed, not the whole
      table every time.
    config:
      tags: ["fact", "incremental"]
      meta:
        owner: analytics-engineering
    columns:
      - name: reservation_id
        description: >
          Not unique on its own — see stg_court_reservations: a handful of
          rows are deliberately duplicated end to end (Lesson 3's
          idempotent-loads discussion). merge on this column is what keeps
          a rerun from doubling them here, which is why this column's own
          test is not_null only, not unique.
        data_tests: [not_null]
      - name: court_number
        description: "{{ doc('court_number') }}"
      - name: status
        description: Confirmed, Cancelled, or Unconfirmed.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Confirmed", "Cancelled", "Unconfirmed"]
      - name: booking_type
        description: Court Booking, Lesson, Tournament, Maintenance, or Closed.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Court Booking", "Lesson", "Tournament", "Maintenance", "Closed"]
      - name: member_id
        description: "{{ doc('member_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
              config:
                severity: warn
                # warn, not error: the GHOST- rows this test genuinely
                # catches (member_id's own doc block) are a known,
                # accepted-for-now data-quality issue, not a broken build.
                # Blocking dbt build on every run over something already
                # understood would just train everyone to ignore the test
                # entirely. Lesson 7's audit trail is where this actually
                # gets acted on, not here.
