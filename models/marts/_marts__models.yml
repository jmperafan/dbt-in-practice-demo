models:
  - name: dim_members
    description: One row per member, the consumption-ready member dimension.
    columns:
      - name: member_id
        data_tests: [unique, not_null]

  - name: dim_coaches
    description: One row per coach.
    columns:
      - name: coach_id
        data_tests: [unique, not_null]

  - name: fct_court_reservations
    description: >
      One row per court reservation. Incremental: only reservations whose
      loaded_at is newer than the last run get processed, not the whole
      table every time.
    columns:
      - name: reservation_id
        data_tests: [not_null]
        # Not unique on its own, see stg_court_reservations: a handful of
        # rows are deliberately duplicated end to end (Lesson 3's
        # idempotent-loads discussion). merge on reservation_id is what
        # keeps a rerun from doubling them here.

  - name: fct_court_activity
    description: >
      Every court-reservation, lesson, and match in one shape (see
      int_court_activity), for "how busy was court N" questions that
      shouldn't have to union three fact tables themselves.
    columns:
      - name: court_activity_id
        description: Surrogate key (dbt_utils.generate_surrogate_key), since no single source column is unique across all three activity types.
        data_tests: [unique, not_null]
